services:
  api:
    build:
      context: .
      dockerfile: backend/deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=${MONGO_URL}
      - MONGO_DB=${MONGO_DB}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL=${LLM_MODEL:-llama3-70b-8192}
      - MODEL_CHECKPOINT=checkpoints/tabular_best.pt
      - MODEL_DEVICE=cpu
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
